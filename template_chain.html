<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef0f3; --bg2:#e2e5ea; --ink:#1b2027; --muted:#5f6772; --line:#c9ced6;
  --panel:#ffffffcc; --accent:#c8332b; --accent-ink:#ffffff; --chip:#ffffff; --chip-on:#1b2027;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --bg2:#0f1114; --ink:#e8eaee; --muted:#9aa3ad; --line:#2c323a;
    --panel:#1c2026dd; --accent:#e0554a; --accent-ink:#ffffff; --chip:#22272e; --chip-on:#e8eaee;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --bg2:#0f1114; --ink:#e8eaee; --muted:#9aa3ad; --line:#2c323a;
  --panel:#1c2026dd; --accent:#e0554a; --accent-ink:#ffffff; --chip:#22272e; --chip-on:#e8eaee;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,var(--bg) 0%,var(--bg2) 100%)}
#stage canvas{display:block;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 18px;pointer-events:none}
.bar > *{pointer-events:auto}
#top{top:0;align-items:flex-start;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.title{display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1 1 auto}
.home{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--ink);text-decoration:none;font-size:16px}
.home:hover{border-color:var(--accent)}
h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em;line-height:1.4}
h1 small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px;max-width:60ch}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;max-width:56vw;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:2px 2px 4px}
.chip{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.chip:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bottom{bottom:0;flex-direction:column;align-items:stretch;gap:8px;background:linear-gradient(to top,var(--bg) 55%,transparent);padding-top:32px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto}
#state{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--muted);white-space:nowrap;min-width:4.5em;text-align:right}
.label{font-weight:700;font-size:14px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.play{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px #0003}
button.play svg{width:18px;height:18px;fill:currentColor}
button.play .pause,button.play[aria-pressed="true"] .go{display:none}
button.play[aria-pressed="true"] .pause{display:block}
button.ghost{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
button.ghost:hover{border-color:var(--ink)}
#t{flex:1 1 auto;min-width:0;accent-color:var(--accent);height:28px}
.opts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.opts .sp{margin-left:auto}
#speed{width:80px;accent-color:var(--accent)}
.help{position:fixed;right:18px;top:calc(64px + env(safe-area-inset-top,0px));background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--muted);width:min(280px,calc(100vw - 36px));line-height:1.6;box-shadow:0 6px 24px #0002}
.help p{margin:0 0 8px} .help p:last-child{margin:0}
.help .note{color:var(--ink);font-size:13px}
.help kbd{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--chip)}
#stage canvas{cursor:grab} #stage canvas:active{cursor:grabbing}
@media (max-width:640px){
  #top{flex-wrap:wrap;gap:8px}
  h1 small{display:none}
  .chips{max-width:100%;width:100%;mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
  .help{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));right:12px;left:12px;width:auto}
  .opts{gap:10px}
}
@media (prefers-reduced-motion: reduce){ body{--dur:0} }
.chip .n{min-width:1em}
</style>
<div id="stage"></div>
<div class="bar" id="top">
  <div class="title">__HOME__<h1>__HEADING__<small>__SUB__</small></h1></div>
  <div class="chips" id="chips" role="group" aria-label="段階"></div>
</div>
<div class="help" id="help" hidden>
  <p class="note">__NOTE__</p>
  <p>ドラッグで回転、ホイール・ピンチで拡大、ダブルクリックで視点を戻す。<kbd>Space</kbd> 再生　<kbd>←</kbd><kbd>→</kbd> 段階を移る</p>
  <p>黒い線は紙の縁といま折る折り目、薄い線はもう一方の立体の折り目。紙は面積をそろえて大きさを変え、共有する立体がぴったり重なるよう置いている（必要なら鏡に映す）。等面四面体のところで別の紙に持ち替え、正多面体のところでは同じ紙のまま折り目を替える。</p>
</div>
<div class="bar" id="bottom">
  <div class="row">
    <button class="play" id="play" aria-label="再生" aria-pressed="false"><svg class="go" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg class="pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg></button>
    <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;gap:8px;align-items:baseline"><span class="label" id="label">—</span><span id="state">0%</span></div>
      <input type="range" id="t" min="0" value="0" aria-label="再折りの進み">
    </div>
  </div>
  <div class="row opts">
    <label><input type="checkbox" id="loop" checked> 往復をくり返す</label>
    <label><input type="checkbox" id="colors" checked> 面に色</label>
    <label class="sp">速さ <input type="range" id="speed" min="1" max="10" value="6" aria-label="速さ"></label>
    <button class="ghost" id="helpBtn" aria-expanded="false" aria-controls="help">説明</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA=/*DATA*/null;
(function(){
const T=window.THREE; const stage=document.getElementById('stage');
const renderer=new T.WebGLRenderer({antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); stage.appendChild(renderer.domElement);
const scene=new T.Scene(); const camera=new T.PerspectiveCamera(38,1,0.1,500);
// 段階: [紙, 立体, 向き]。向き +1 は折る（0→1）、-1 は開く（1→0）
// 紙を順につなぐ。紙 n は立体 order[n][0] から開いて order[n][1] に折る（0 = 正多面体、1 = 等面四面体）。align は紙ごとの置き方（相似変換）
const C=DATA.chain, NETS=[DATA,...C.nets], ALIGN=C.align.map(a=>new T.Matrix4().fromArray(a));
const nm=(n,ti)=>NETS[n].targets[ti].label.replace('等面四面体 ','');
const PAPER=[]; C.order.forEach(([o],n)=>PAPER.push(n===0?0:(o===0?PAPER[n-1]:PAPER[n-1]+1)));   // 正多面体を共有するなら同じ紙
const PL=n=>'紙 '+String.fromCharCode(65+PAPER[n]);
const STEPS=[]; C.order.forEach(([o,f],n)=>{ STEPS.push([n,o,-1,nm(n,o)+' を開いて '+PL(n)+' に',nm(n,o)+' を開く']); STEPS.push([n,f,1,PL(n)+' を'+(f===1?'等面四面体 ':'')+nm(n,f)+' に',nm(n,f)+' に折る']); });
const NS=STEPS.length;
function onSeg(m,a,b){ const cr=(b[0]-a[0])*(m[1]-a[1])-(b[1]-a[1])*(m[0]-a[0]); if(Math.abs(cr)>1e-6) return false;
  return Math.min(a[0],b[0])-1e-6<=m[0]&&m[0]<=Math.max(a[0],b[0])+1e-6&&Math.min(a[1],b[1])-1e-6<=m[1]&&m[1]<=Math.max(a[1],b[1])+1e-6; }
function normalOf(p){ const [a,b,c]=p; const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
  const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]; const L=Math.hypot(...n)||1; return n.map(x=>x/L); }
const sheets=NETS.map((D,s)=>{
  const group=new T.Group(); group.matrixAutoUpdate=false; scene.add(group);
  const panels=D.panels.map(p=>{
    const mesh=new T.Mesh(new T.ShapeGeometry(new T.Shape(p.poly.map(v=>new T.Vector2(v[0],v[1])))),new T.MeshBasicMaterial({color:0xffffff,side:T.DoubleSide})); mesh.matrixAutoUpdate=false;
    const mk=op=>{ const l=new T.LineSegments(new T.BufferGeometry(),new T.LineBasicMaterial({color:0x1b2027,transparent:true,opacity:op})); l.matrixAutoUpdate=false; group.add(l); return l; };
    group.add(mesh);
    let A=0,cx=0,cy=0; const q=p.poly; for(let k=0;k<q.length;k++){ const a=q[k],b=q[(k+1)%q.length],c=a[0]*b[1]-b[0]*a[1]; A+=c; cx+=(a[0]+b[0])*c; cy+=(a[1]+b[1])*c; }   // 面積と重心（中心合わせ用）
    return {mesh,edge:{line:mk(0.95),faint:mk(0.22)},poly:p.poly,area:Math.abs(A/2),cen:[cx/(3*A),cy/(3*A)]};
  });
  const E=D.panels.map(p=>p.poly.map((v,k)=>({a:v,b:p.poly[(k+1)%p.poly.length],partner:-1})));
  for(let i=0;i<E.length;i++) for(const e of E[i]){ const m=[(e.a[0]+e.b[0])/2,(e.a[1]+e.b[1])/2];
    outer: for(let j=0;j<E.length;j++){ if(j===i) continue; for(const f of E[j]) if(onSeg(m,f.a,f.b)){ e.partner=j; break outer; } } }
  // 立体ごとの折り目（向きの違う隣のパネル）
  const crease=D.targets.map(tg=>{ const N=tg.target3d.map(normalOf); return E.map((es,i)=>es.map(e=>{ if(e.partner<0) return 'bnd';
    const a=N[i],b=N[e.partner],c=tg.target3d[e.partner][0],p0=tg.target3d[i][0]; const d=(c[0]-p0[0])*a[0]+(c[1]-p0[1])*a[1]+(c[2]-p0[2])*a[2];
    return (Math.abs(a[0]*b[0]+a[1]*b[1]+a[2]*b[2]-1)<1e-6&&Math.abs(d)<1e-6)?'flat':'crease'; })); });
  const M=D.panels.map(()=>new T.Matrix4());
  return {D,group,panels,E,crease,M,s};
});
function classify(sh,ti){
  const C=sh.crease[ti], O=sh.crease[1-ti];
  sh.panels.forEach((p,i)=>{ const L=[],F=[];
    sh.E[i].forEach((e,k)=>{ const seg=[e.a[0],e.a[1],0,e.b[0],e.b[1],0]; if(C[i][k]!=='flat') L.push(...seg); else if(O[i][k]==='crease') F.push(...seg); });
    for(const [k,arr] of [['line',L],['faint',F]]){ p.edge[k].geometry.dispose(); const g=new T.BufferGeometry(); g.setAttribute('position',new T.Float32BufferAttribute(arr,3)); p.edge[k].geometry=g; } });
}
const tmpA=new T.Matrix4(), tmpB=new T.Matrix4(), v0=new T.Vector3(), v1=new T.Vector3(), ax=new T.Vector3();
function pose(sh,ti,tt){   // 紙 sh を立体 ti へ tt だけ折る。ALIGN を掛けた世界座標の面積重心を返す
  const D=sh.D, th=D.targets[ti].theta;
  for(const c of D.order){ const p=D.parent[c], h=D.hinge[c];
    if(p<0){ sh.M[c].identity(); continue; }
    v0.set(h[0][0],h[0][1],0).applyMatrix4(sh.M[p]); v1.set(h[1][0],h[1][1],0).applyMatrix4(sh.M[p]); ax.subVectors(v1,v0).normalize();
    tmpA.makeRotationAxis(ax,tt*th[c]); tmpB.makeTranslation(v0.x,v0.y,v0.z); tmpA.premultiply(tmpB); tmpB.makeTranslation(-v0.x,-v0.y,-v0.z); tmpA.multiply(tmpB);
    sh.M[c].multiplyMatrices(tmpA,sh.M[p]); }
  const cen=new T.Vector3(), vv=new T.Vector3(); let W=0;
  sh.panels.forEach((p,i)=>{ vv.set(p.cen[0],p.cen[1],0).applyMatrix4(sh.M[i]).applyMatrix4(ALIGN[sh.s]); cen.addScaledVector(vv,p.area); W+=p.area; });
  return cen.multiplyScalar(1/W);
}
function place(sh,cen){ const shift=new T.Matrix4().makeTranslation(-cen.x,-cen.y,-cen.z).multiply(ALIGN[sh.s]);
  sh.panels.forEach((p,i)=>{ p.mesh.matrix.multiplyMatrices(shift,sh.M[i]); for(const k in p.edge) p.edge[k].matrix.copy(p.mesh.matrix); }); }
// 中心は等面四面体（2 枚で同じ面）の面積重心に固定。開いた紙はその周りに置く
const CEN=pose(sheets[0],C.order[0][1],1);
let ext=0; for(const sh of sheets){ pose(sh,0,0); const vv=new T.Vector3(); sh.panels.forEach((p,i)=>{ for(const v of p.poly){ vv.set(v[0],v[1],0).applyMatrix4(sh.M[i]).applyMatrix4(ALIGN[sh.s]).sub(CEN); ext=Math.max(ext,vv.length()); } }); }
ext=ext*0.8+0.5;
const colorsEl=document.getElementById('colors'); const PLAIN='#f4f3ee';
let step=-1, s=0, dir=1, playing=false, hold=0;
function applyColors(){ const [n,ti]=STEPS[step]; const sh=sheets[n], cols=sh.D.targets[ti].colors; sh.panels.forEach((p,k)=>p.mesh.material.color.set(colorsEl.checked?cols[k]:PLAIN)); }
colorsEl.addEventListener('change',applyColors);
document.getElementById('t').max=NS*1000;
const chips=document.getElementById('chips'), labelEl=document.getElementById('label'), stateEl=document.getElementById('state'), tEl=document.getElementById('t'), playBtn=document.getElementById('play'), speedEl=document.getElementById('speed'), loopEl=document.getElementById('loop');
STEPS.map(st=>st[4]).forEach((txt,i)=>{ const b=document.createElement('button'); b.className='chip'; b.innerHTML='<span class="n">'+(i+1)+'</span>'; b.append(txt); b.setAttribute('aria-pressed','false'); b.onclick=()=>{ setPlaying(false); s=i; tEl.value=s*1000; }; chips.appendChild(b); });
function setStep(i){ if(i===step) return; step=i; const [n,ti]=STEPS[i]; sheets.forEach((sh,k)=>sh.group.visible=k===n); classify(sheets[n],ti); applyColors();
  [...chips.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i)); labelEl.textContent=(i+1)+'/'+NS+'　'+STEPS[i][3]; }
function setPlaying(v){ playing=v; playBtn.setAttribute('aria-pressed',v); playBtn.setAttribute('aria-label',v?'一時停止':'再生'); }
playBtn.onclick=()=>{ if(!playing&&!loopEl.checked&&(s>=NS&&dir>0||s<=0&&dir<0)) dir=-dir; setPlaying(!playing); };
tEl.addEventListener('input',()=>{ setPlaying(false); s=tEl.value/1000; });
const helpEl=document.getElementById('help'), helpBtn=document.getElementById('helpBtn');
function showHelp(v){ helpEl.hidden=!v; helpBtn.setAttribute('aria-expanded',v); } helpBtn.onclick=()=>showHelp(helpEl.hidden); showHelp(innerWidth>640);
addEventListener('keydown',e=>{ const onCtl=/^(INPUT|BUTTON|A)$/.test(e.target.tagName);
  if(e.key===' '&&!onCtl){ e.preventDefault(); playBtn.click(); }
  else if(e.key==='ArrowRight'&&e.target.type!=='range'){ e.preventDefault(); setPlaying(false); s=Math.min(NS,Math.floor(s+1e-9)+1); tEl.value=s*1000; }
  else if(e.key==='ArrowLeft'&&e.target.type!=='range'){ e.preventDefault(); setPlaying(false); s=Math.max(0,Math.ceil(s-1e-9)-1); tEl.value=s*1000; }
  else if(e.key==='Escape') showHelp(false); });
// 視点
const YAW0=0.6, PITCH0=0.55; let yaw=YAW0, pitch=PITCH0, dist=1;
const fitDist=()=>ext*1.3/(Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect));
function cam(){ camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),dist*Math.cos(pitch)*Math.cos(yaw)); camera.lookAt(0,0,0); }
const ptrs=new Map(); let pinch0=null; const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{ e.preventDefault(); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{ el.setPointerCapture(e.pointerId); }catch(_){} if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),dist}; } });
el.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; e.preventDefault();
  if(ptrs.size===1){ const p=ptrs.get(e.pointerId); yaw-=(e.clientX-p.x)*0.008; pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-p.y)*0.008)); }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch0){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); dist=Math.max(ext*0.8,Math.min(ext*12,pinch0.dist*pinch0.d/Math.max(d,1))); } });
const release=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; };
el.addEventListener('dblclick',()=>{ yaw=YAW0; pitch=PITCH0; dist=fitDist(); });
el.addEventListener('pointerup',release); el.addEventListener('pointercancel',release); el.addEventListener('lostpointercapture',release);
['touchstart','touchmove'].forEach(t=>el.addEventListener(t,e=>e.preventDefault(),{passive:false}));
el.addEventListener('wheel',e=>{ e.preventDefault(); dist=Math.max(ext*0.8,Math.min(ext*12,dist*(1+e.deltaY*0.001))); },{passive:false});
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); dist=fitDist(); } addEventListener('resize',resize); resize();
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){
    if(hold>0) hold-=dt;
    else { const prev=s; s=Math.max(0,Math.min(NS,s+dir*speedEl.value*0.08*dt));
      if(Math.floor(prev+1e-9)!==Math.floor(s+1e-9)||s===NS||s===0) hold=0.7;          // 段階の境目で少し止める
      if(s>=NS&&dir>0||s<=0&&dir<0){ hold=1.4; if(loopEl.checked) dir=-dir; else setPlaying(false); } }
    tEl.value=Math.round(s*1000); }
  // 段階 i の中の進み u（0..1）→ 折り具合 tt
  const i=Math.min(NS-1,Math.floor(s));   // 境目（s が整数）では前後の段階が同じ形になる（X* では紙 A と紙 B が重なる）
  const u=Math.max(0,Math.min(1,s-i)); setStep(i);
  const [n,ti,d]=STEPS[i], tt=d>0?u:1-u, sh=sheets[n];
  pose(sh,ti,tt); place(sh,CEN); cam();
  stateEl.textContent=Math.round(s/NS*100)+'%';
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
