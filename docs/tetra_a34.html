<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>箱2つと四面体6種（面積34）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef0f3; --bg2:#e2e5ea; --ink:#1b2027; --muted:#5f6772; --line:#c9ced6;
  --panel:#ffffffcc; --accent:#c8332b; --accent-ink:#ffffff; --chip:#ffffff; --chip-on:#1b2027;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --bg2:#0f1114; --ink:#e8eaee; --muted:#9aa3ad; --line:#2c323a;
    --panel:#1c2026dd; --accent:#e0554a; --accent-ink:#ffffff; --chip:#22272e; --chip-on:#e8eaee;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --bg2:#0f1114; --ink:#e8eaee; --muted:#9aa3ad; --line:#2c323a;
  --panel:#1c2026dd; --accent:#e0554a; --accent-ink:#ffffff; --chip:#22272e; --chip-on:#e8eaee;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 60%,var(--bg) 0%,var(--bg2) 100%)}
#stage canvas{display:block;outline:none;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
.bar{position:fixed;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px 18px;pointer-events:none}
.bar > *{pointer-events:auto}
#top{top:0;justify-content:space-between}
#bottom{bottom:0;background:linear-gradient(to top,var(--bg) 60%,transparent);padding-top:28px;flex-wrap:wrap}
h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
h1 small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;max-width:62vw;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:2px 0 4px}
.chip{flex:0 0 auto;white-space:nowrap;scroll-snap-align:start}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--bg);border-color:var(--chip-on)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#state{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;color:var(--muted);min-width:14em}
#state b{color:var(--ink);font-weight:500}
button.play{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
input[type=range]{width:min(360px,50vw);accent-color:var(--accent)}
label.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend{position:fixed;right:18px;top:64px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted);max-width:240px;line-height:1.5}
@media (max-width:640px){ .legend{display:none} h1 small{display:none} #top{flex-wrap:wrap;gap:8px} .chips{max-width:100%;width:100%;mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)} }
@media (prefers-reduced-motion: reduce){ body{--dur:0} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar" id="top">
  <h1>一枚の展開図，1×1×8・1×2×5 と等面四面体 6 種<small>面積 34 の展開図が 1×1×8，1×2×5 の箱と，形の違う 6 種の等面四面体に折れる（箱 2 + 四面体 6 = 8 通り）　／　出典：Biswas–Demaine 2017</small></h1>
  <div class="chips" id="chips"></div>
</div>
<div class="legend" id="legend">ドラッグで回転、ホイールで拡大。黒い線は紙の縁といま折る折り目、薄い線はマスの境目や他の折り方の折り目（この折り方では平ら）。折り目の角度を 0 から目標値まで一斉に動かしているので、途中で面が重なって見えることがあります。</div>
<div class="bar" id="bottom">
  <button class="play" id="play">再生</button>
  <input type="range" id="t" min="0" max="1000" value="0" aria-label="折り進み">
  <span id="state"><b>—</b></span>
  <label class="opt"><input type="checkbox" id="loop" checked> 自動で往復</label>
  <label class="opt"><input type="checkbox" id="colors" checked> 面に色</label>
  <label class="opt">速さ <input type="range" id="speed" min="1" max="10" value="6" style="width:90px" aria-label="速さ"></label>
</div>

function pose(tt){
  const th=DATA.targets[target].theta;
  M[0].identity();
  for(const c of DATA.order){ if(c===0) continue; const p=DATA.parent[c]; const h=DATA.hinge[c];
    v0.set(h[0][0],h[0][1],0).applyMatrix4(M[p]); v1.set(h[1][0],h[1][1],0).applyMatrix4(M[p]); ax.subVectors(v1,v0).normalize();
    tmpA.makeRotationAxis(ax,tt*th[c]); tmpB.makeTranslation(v0.x,v0.y,v0.z); tmpA.premultiply(tmpB); tmpB.makeTranslation(-v0.x,-v0.y,-v0.z); tmpA.multiply(tmpB);
    M[c].multiplyMatrices(tmpA,M[p]); }
  // centre of mass of vertices
  const cen=new T.Vector3(); let k=0; const vv=new T.Vector3();
  panels.forEach((p,i)=>{ for(const v of p.poly){ vv.set(v[0],v[1],0).applyMatrix4(M[i]); cen.add(vv); k++; } }); cen.multiplyScalar(1/k);
  const shift=new T.Matrix4().makeTranslation(-cen.x,-cen.y,-cen.z);
  panels.forEach((p,i)=>{ p.mesh.matrix.multiplyMatrices(shift,M[i]); for(const k in p.edge) p.edge[k].matrix.copy(p.mesh.matrix); });
}
// camera & orbit
let yaw=0.6, pitch=0.55, dist=1; const fitDist=()=>ext*1.3/(Math.tan(camera.fov*Math.PI/360)*Math.min(1,camera.aspect)); function cam(){ camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),dist*Math.cos(pitch)*Math.cos(yaw)); camera.lookAt(0,0,0); }
// pointer handling: 1 finger/mouse = rotate, 2 fingers = pinch zoom (touch-action:none keeps the page from scrolling)
const ptrs=new Map(); let pinch0=null;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{ e.preventDefault(); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{ el.setPointerCapture(e.pointerId); }catch(_){} if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),dist}; } });
el.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; e.preventDefault();
  if(ptrs.size===1){ const p=ptrs.get(e.pointerId); yaw-=(e.clientX-p.x)*0.008; pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-p.y)*0.008)); }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2 && pinch0){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); dist=Math.max(ext*0.8,Math.min(ext*12,pinch0.dist*pinch0.d/Math.max(d,1))); } });
const release=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=null; };
el.addEventListener('pointerup',release); el.addEventListener('pointercancel',release); el.addEventListener('lostpointercapture',release);
['touchstart','touchmove'].forEach(t=>el.addEventListener(t,e=>e.preventDefault(),{passive:false}));
renderer.domElement.addEventListener('wheel',e=>{ e.preventDefault(); dist=Math.max(ext*0.8,Math.min(ext*12,dist*(1+e.deltaY*0.001))); },{passive:false});
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); dist=fitDist(); } addEventListener('resize',resize); resize();
// controls
playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'一時停止':'再生'; };
tEl.addEventListener('input',()=>{ playing=false; playBtn.textContent='再生'; t=tEl.value/1000; });
const ease=x=>x;   // linear: constant folding speed
let hold=0, last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing){ const sp=speedEl.value*0.08;
    if(phase==='fold'){ t+=sp*dt; if(t>=1){t=1; phase='hold'; hold=0;} }
    else if(phase==='hold'){ hold+=dt; if(hold>1.2){ phase=loopEl.checked?'unfold':'done'; } }
    else if(phase==='unfold'){ t-=sp*dt; if(t<=0){ t=0; phase='switch'; hold=0; } }
    else if(phase==='switch'){ hold+=dt; if(hold>0.5){ setTarget((target+1)%DATA.targets.length); phase='fold'; } }
    tEl.value=Math.round(t*1000);
  }
  pose(ease(t)); cam();
  const tg=DATA.targets[target]; stateEl.innerHTML='<b>'+tg.label+'</b> 　折り '+Math.round(t*100)+'%';
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
